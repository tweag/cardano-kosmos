name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - run: nix develop

#      - shell: 'nix develop -c bash -e {0}'
#        run: timeout 3m scripts/run-peras-testnet.sh
