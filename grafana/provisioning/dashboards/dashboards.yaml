# Grafana dashboard provider for the Cardano Kosmos devnet.
# Loads every dashboard JSON found in this directory.
apiVersion: 1

providers:
  - name: 'Cardano Dashboard'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: grafana/provisioning/dashboards
