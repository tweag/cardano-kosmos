# Configuration of the Peras integration map for kosmos `peras/integration-main`.
# See README.md for the format.

[kosmos]
base = "144e8a096f"  # the kosmos commit the steps start from
branch = "peras/integration-main"

# One entry per vendored repository, in display order. `path` is a local clone that has the integration
# branch and its topic branches; `base` is the upstream commit the integration branch starts from.

[[repo]]
name = "cardano-base"
path = "~/code/cardano-base-main-v2"
fork = "gdeest/cardano-base"
base = "196a0a291"
base_label = "master"
base_url = "https://github.com/IntersectMBO/cardano-base/commit/196a0a291"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "cardano-ledger"
path = "~/code/cardano-ledger-main-v2"
fork = "tweag/cardano-ledger"
base = "cc2b0654c9"
base_label = "master"
base_url = "https://github.com/IntersectMBO/cardano-ledger/commit/cc2b0654c9"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "ouroboros-network"
path = "~/code/ouroboros-network-main"
fork = "tweag/ouroboros-network"
base = "34831d62d6"
base_label = "main"
base_url = "https://github.com/IntersectMBO/ouroboros-network/commit/34831d62d6"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "ouroboros-consensus"
path = "~/code/consensus-main-v2"
fork = "tweag/ouroboros-consensus"
base = "817363d62b"
base_label = "main"
base_url = "https://github.com/IntersectMBO/ouroboros-consensus/commit/817363d62b"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "cardano-api"
path = "~/code/cardano-api-main"
fork = "tweag/cardano-api"
base = "52e8d2fd1"
base_label = "master"
base_url = "https://github.com/IntersectMBO/cardano-api/commit/52e8d2fd1"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "cardano-node"
path = "~/code/cardano-node-main"
fork = "tweag/cardano-node"
base = "875ce5c93f"
base_label = "master"
base_url = "https://github.com/IntersectMBO/cardano-node/commit/875ce5c93f"
branch = "peras/kosmos-integration-main"

[[repo]]
name = "cardano-cli"
path = "~/code/cardano-cli-main"
fork = "tweag/cardano-cli"
base = "d9730d8a7a"
base_label = "master"
base_url = "https://github.com/IntersectMBO/cardano-cli/commit/d9730d8a7a"
branch = "peras/kosmos-integration-main"

# Other open PRs a merged changeset contains.

[[includes]]
repo = "ouroboros-consensus"
ref = "tweag/ouroboros-consensus#36"
pr = "IntersectMBO/ouroboros-consensus#2321"
title = "[Peras 71] Support graceful Object Diffusion termination"
draft = false

[[includes]]
repo = "ouroboros-consensus"
ref = "tweag/ouroboros-consensus#36"
pr = "IntersectMBO/ouroboros-consensus#2322"
title = "[Peras 72] Make Object Diffusion server idleness explicit"
draft = false

[[includes]]
repo = "ouroboros-consensus"
ref = "tweag/ouroboros-consensus#36"
pr = "IntersectMBO/ouroboros-consensus#2286"
title = "Peras: support Object Diffusion termination and GSM caught-up detection"
draft = true

[[includes]]
repo = "ouroboros-consensus"
ref = "tweag/ouroboros-consensus#36"
pr = "IntersectMBO/ouroboros-consensus#2326"
title = "Drop `PerasCertTicketNo` and just use `PerasRoundNo` directly"
draft = true

# Changesets whose kind is not given by their branch prefix. "stub": a placeholder pending real work.

[[kind_override]]
repo = "cardano-ledger"
ref = "peras/trivial-cert-validation"
kind = "stub"
note = "placeholder until step 20 (cardano-peras #276) validates certificates"
url = "https://github.com/tweag/cardano-peras/issues/276"

# Cross-repository requirements: `repo`/`ref` requires `needs_repo`/`needs_ref` ("@base": that repository's base).
# "build": the dependent uses what the dependency introduces; "runtime": it builds without it but does not work.

[[requires]]
repo = "cardano-cli"
ref = "kosmos-compat/consensus-main"
needs_repo = "cardano-api"
needs_ref = "kosmos-compat/consensus-main"
how = "build"
why = "cardano-cli builds against cardano-api, adapted to ledger master and consensus main"

[[requires]]
repo = "cardano-node"
ref = "kosmos-compat/consensus-main"
needs_repo = "cardano-api"
needs_ref = "kosmos-compat/consensus-main"
how = "build"
why = "cardano-node builds against cardano-api, adapted to ledger master and consensus main"

[[requires]]
repo = "cardano-node"
