# Kosmos-side changes listed under a step, by step number.
[kosmos_side]
1 = [
  "CHaP index-state 2026-11-05; grapesy >= 1.2.1 from CHaP instead of a git pin",
  "Vendor cardano-diffusion, network-mux, ntp-client, monoidal-synchronisation, cardano-ledger-shelley-test",
  "Vanilla scenario: drop the PERAS_* env, which nothing reads any more",
  "Trim the PlutusV4 cost model of the generated Dijkstra genesis (251 params)",
]
2 = [
  "Vendor cardano-base master's crypto packages (no crypto-class 2.6 constraint)",
  "Context-less cardano-keys a549816 from git",
  "Build plutus-core with a single job (now built in place)",
]
5 = [
  "Vanilla scenario: Peras parameters in the Dijkstra genesis",
]

# Cross-repository requirements: `repo`/`ref` requires `needs_repo`/`needs_ref` ("@base": that repository's base).
# "build": the dependent uses what the dependency introduces; "runtime": it builds without it but does not work.

[[requires]]
repo = "cardano-cli"
ref = "kosmos-compat/consensus-main"
needs_repo = "cardano-api"
needs_ref = "kosmos-compat/consensus-main"
